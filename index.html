<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Purvil Patel — Chief Compliance Officer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=DM+Sans:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background-color: #070b11;
    background-image:
      linear-gradient(rgba(30,60,110,0.2) 1px, transparent 1px),
      linear-gradient(90deg, rgba(30,60,110,0.2) 1px, transparent 1px),
      linear-gradient(rgba(30,60,110,0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(30,60,110,0.07) 1px, transparent 1px);
    background-size: 80px 80px, 80px 80px, 20px 20px, 20px 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'DM Sans', sans-serif;
    padding: 2rem 1rem;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 70% at 50% 50%, rgba(7,11,17,0.6) 0%, transparent 70%),
      radial-gradient(ellipse 45% 35% at 10% 90%, rgba(180,160,110,0.05) 0%, transparent 60%),
      radial-gradient(ellipse 40% 30% at 90% 10%, rgba(20,60,140,0.08) 0%, transparent 60%);
    pointer-events: none;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse 100% 40% at 50% 100%, rgba(5,10,25,0.8) 0%, transparent 70%);
    pointer-events: none;
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: #0f1520;
    border: 1px solid rgba(30,70,140,0.45);
    border-radius: 20px;
    overflow: hidden;
    animation: fadeUp 0.7s ease both;
    position: relative;
    z-index: 1;
    box-shadow: 0 0 0 1px rgba(180,160,110,0.08), 0 24px 60px rgba(0,0,0,0.5);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card-header {
    padding: 2.5rem 2rem 2rem;
    position: relative;
  }

  .card-header::after {
    content: '';
    position: absolute;
    bottom: 0; left: 2rem; right: 2rem;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(180,160,110,0.4), transparent);
  }

  .name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2rem;
    font-weight: 500;
    color: #f0ead8;
    letter-spacing: 0.02em;
    line-height: 1.1;
    margin-bottom: 0.45rem;
  }

  .title-text {
    font-family: 'Inter', sans-serif;
    font-size: 0.78rem;
    font-weight: 500;
    color: #c8ab6e;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 0.65rem;
  }

  .credentials {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 0.5rem 0 0.65rem;
  }

  .cred-badge {
    font-family: 'Inter', sans-serif;
    font-size: 0.65rem;
    font-weight: 500;
    letter-spacing: 0.06em;
    color: rgba(200,171,110,0.75);
    padding: 0 2px;
  }

  .divider-line {
    width: 36px;
    height: 1px;
    background: rgba(180,160,110,0.4);
    margin: 0.9rem 0 0;
  }

  .card-body {
    padding: 1.5rem 2rem 2rem;
    display: flex;
    flex-direction: column;
  }

  .contact-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0.85rem 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    text-decoration: none;
    transition: all 0.2s ease;
  }

  .contact-item:last-child { border-bottom: none; }

  .contact-item:hover .item-text { color: #c8ab6e; }
  .contact-item:hover .icon-wrap { border-color: rgba(180,160,110,0.5); background: rgba(180,160,110,0.08); }

  .icon-wrap {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s ease;
  }

  .icon-wrap svg {
    width: 18px;
    height: 18px;
    stroke: #c8ab6e;
    stroke-width: 1.5;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .item-label {
    font-size: 0.68rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
    margin-bottom: 2px;
  }

  .item-text {
    font-size: 0.88rem;
    color: #d4cdbf;
    font-weight: 400;
    transition: color 0.2s;
    word-break: break-all;
  }

  .footer {
    padding: 0.75rem 2rem 1.5rem;
    text-align: center;
  }

  .footer span {
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.15);
  }
</style>
</head>

    <div class="credentials">
